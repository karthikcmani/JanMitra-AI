# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, inserted to sys.path if present.
prepend_sys_path = .

sqlalchemy.url = postgresql+psycopg2://postgres:postgres@172.26.206.129:5432/janmitra_ai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
